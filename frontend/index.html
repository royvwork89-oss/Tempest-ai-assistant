<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempest</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/modals.css?v=5" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/diff.css" />
  <link rel="stylesheet" href="styles/devpanel.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="styles/login.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Tempest</h2>

      <button id="newChatBtn">+ Nuevo Chat</button>
      <!-- Arriba de la lista, junto a "+ Nuevo Chat", y no debajo del último
           chat: es una acción, no un chat. Debajo del último se movería de
           lugar cada vez que crece la lista y quedaría fuera de pantalla
           apenas hay unos pocos chats. El <input type="file"> no está acá:
           lo crea y reusa promptImportChat() en sidebar.js, compartido con
           el botón de importar de cada proyecto. El SVG va inline y con
           fill="currentColor" para heredar el color del botón (mismo criterio
           que el engranaje de Configuración) — un emoji lo dibujaría la fuente
           del sistema, con su propio color y tamaño. -->
      <button id="importChatBtn" class="btn-with-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        <span>Importar chat</span>
      </button>
      <div id="chatList"></div>

      <hr>

      <button id="newProjectBtn">+ Nuevo Proyecto</button>
      <!-- Mismo criterio que "Importar chat": arriba de la lista, junto al
           botón de crear. Importa un .tempestproj (ver promptImportProject()
           en sidebar.js). Exportar y abrir carpeta de un proyecto viven en el
           menú "⋯" de cada proyecto, no acá — necesitan saber cuál. -->
      <button id="importProjectBtn" class="btn-with-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
        <span>Importar proyecto</span>
      </button>
      <div id="projectList"></div>

      <div class="sidebar-footer">
        <button id="settingsBtn" class="sidebar-settings-btn" title="Configuración">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.68.07-1.08s-.03-.74-.07-1.08l2.32-1.82c.21-.16.27-.46.13-.7l-2.2-3.81c-.13-.23-.42-.31-.65-.23l-2.74 1.1c-.57-.44-1.18-.8-1.86-1.07L14.15 3.1c-.05-.25-.27-.44-.53-.44h-4.4c-.26 0-.47.19-.52.44L8.23 5.89C7.55 6.16 6.94 6.52 6.37 6.96L3.63 5.86c-.24-.09-.52 0-.65.23L.78 9.9c-.14.24-.08.54.13.7l2.32 1.82C3.19 12.76 3.16 13.1 3.16 13.5s.03.74.07 1.08L.91 16.4c-.21.16-.27.46-.13.7l2.2 3.81c.13.23.42.31.65.23l2.74-1.1c.57.44 1.18.8 1.86 1.07l.42 2.79c.05.25.27.44.53.44h4.4c.26 0 .47-.19.52-.44l.42-2.79c.68-.27 1.29-.63 1.86-1.07l2.74 1.1c.24.09.52 0 .65-.23l2.2-3.81c.14-.24.08-.54-.13-.7l-2.32-1.82z"/></svg>
        </button>
      </div>
    </aside>

    <div class="chat-app">
      <header class="chat-header">
        <h1>Tempest</h1>
        <p>Asistente local conectado a tu backend</p>

        <div class="smart-menu">
          <button id="menuTrigger" class="smart-menu-trigger">modelo</button>

          <div id="smartMenuPanel" class="smart-menu-panel hidden">
            <div id="menuViewRoot" class="menu-view">
              <button class="menu-item" data-view="local">local</button>
              <button class="menu-item" data-view="services">servicios</button>
            </div>

            <div id="menuViewLocal" class="menu-view hidden">
              <button class="menu-back" data-back="root">← volver</button>
              <!-- Los modelos locales se generan desde app.js según el perfil de hardware -->
            </div>

            <div id="menuViewServices" class="menu-view hidden">
              <button class="menu-back" data-back="root">← volver</button>
              <button class="menu-item service-entry" data-service="openai">OpenAI</button>
              <button class="menu-item service-entry" data-service="google">Google</button>
            </div>

            <div id="menuViewOpenAI" class="menu-view hidden">
              <button class="menu-back" data-back="services">← volver</button>
              <button class="menu-item service-model" data-service="openai"
                data-model="gpt-4o-mini">GPT-4o-mini</button>
              <button class="menu-item service-model" data-service="openai"
                data-model="gpt-4.1-mini">GPT-4.1-mini</button>
            </div>

            <div id="menuViewGoogle" class="menu-view hidden">
              <button class="menu-back" data-back="services">← volver</button>
              <button class="menu-item service-model" data-service="google" data-model="gemini-2.5-flash">Gemini 2.5
                Flash</button>
              <button class="menu-item service-model" data-service="google" data-model="gemini-2.5-pro">Gemini 2.5
                Pro</button>
            </div>
          </div>
        </div>
      </header>

      <main id="chatBox" class="chat-box"></main>

      <div id="typing" class="typing"></div>

      <footer class="chat-input-area">
        <div class="input-wrapper">
          <div id="attachmentPreview" class="attachment-preview hidden"></div>
          <textarea id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off" spellcheck="true" rows="1"></textarea>
          <div class="input-toolbar">
            <div class="tool-menu">
              <button id="toolMenuBtn" class="tool-menu-btn">+</button>
              <div id="toolMenuPanel" class="tool-menu-panel hidden">
                <button id="transcriptionBtn" class="tool-menu-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm-1 3a1 1 0 0 1 2 0v8a1 1 0 0 1-2 0V4zm-4 8a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V21h2v2H9v-2h2v-2.08A7 7 0 0 1 5 12H7z"/></svg>
                  Transcripción
                </button>
                <button id="addFileBtn" class="tool-menu-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M13.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5L13.5 2zM13 9V3.5L18.5 9H13zm-2 5h-2v-2h2V9h2v3h2v2h-2v3h-2v-3z"/></svg>
                  Añadir archivo
                </button>
                <input type="file" id="fileInput" multiple
                  accept="image/*,.pdf,.docx,.xlsx,.txt,.md,.html,.css,.js,.ts,.jsx,.tsx,.json,.yaml,.yml,.xml,.csv,.py,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.sh,.bash,.env,.ini,.toml,.sql"
                  style="display:none">
                <button class="tool-menu-item" disabled>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:0.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                  Crear imagen
                </button>
                <button class="tool-menu-item" disabled>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:0.4"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.723v6.554a1 1 0 0 1-1.447.894L15 14v-4zM3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg>
                  Crear video
                </button>
              </div>
            </div>
            <button id="sendBtn" class="send-btn" title="Enviar">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405z" />
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <div id="transcriptionModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>Transcripción</h2>

      <label>Audio</label>
      <input type="file" id="transcriptionAudioInput" accept="audio/*" />

      <label>Tipo de texto</label>
      <select id="transcriptionMode">
        <option value="plain">Texto corrido</option>
        <option value="timestamps">Con divisiones de tiempo</option>
      </select>

      <label>Formato</label>
      <select id="transcriptionFormat">
        <option value="txt">TXT</option>
        <option value="pdf">PDF</option>
        <option value="docx">DOCX</option>
      </select>

      <div class="modal-actions">
        <button id="cancelTranscriptionBtn">Cancelar</button>
        <button id="processTranscriptionBtn">Crear archivo</button>
      </div>
    </div>
  </div>

  <div id="deleteConfirmModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>Confirmar eliminación</h2>
      <p id="deleteConfirmText"></p>

      <div class="modal-actions">
        <button id="cancelDeleteBtn">Cancelar</button>
        <button id="confirmDeleteBtn">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="newProjectModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>Nuevo proyecto</h2>

      <label>Nombre del proyecto</label>
      <input id="newProjectNameInput" type="text" placeholder="Ejemplo: IA local, Trabajo, Backend..." />

      <div class="modal-actions">
        <button id="cancelNewProjectBtn">Cancelar</button>
        <button id="confirmNewProjectBtn">Crear</button>
      </div>
    </div>
  </div>
  <div id="renameModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>Renombrar</h2>
      <label id="renameModalLabel">Nuevo nombre</label>
      <input id="renameModalInput" type="text" placeholder="Escribe el nuevo nombre..." />
      <div class="modal-actions">
        <button id="cancelRenameBtn">Cancelar</button>
        <button id="confirmRenameBtn">Renombrar</button>
      </div>
    </div>
  </div>
  <!-- Modal: Context Files del proyecto -->
  <div id="contextFilesModal" class="modal-overlay hidden">
    <div class="modal-box modal-box--wide">
      <h2>Archivos de contexto — <span id="contextFilesProjectName"></span></h2>

      <div class="context-files-upload">
        <label class="context-upload-label">
          <input type="file" id="contextFileInput" multiple
            accept=".txt,.md,.html,.css,.js,.ts,.jsx,.tsx,.json,.yaml,.yml,.xml,.csv,.py,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.sh,.bash,.env,.ini,.toml,.sql,.pdf,.docx,.xlsx,.pptx"
            style="display:none">
          <button type="button" id="contextUploadBtn" class="btn-secondary">+ Subir archivos</button>
        </label>
        <span id="contextUploadStatus" class="context-upload-status"></span>
      </div>

      <!-- Carpeta del proyecto: un solo campo de ruta, compartido por Código y
           Documentos dentro de UN MISMO proyecto (decisión del usuario: casi
           siempre escanea la misma carpeta para ambos). Lo que NO debe compartirse
           es este valor ENTRE proyectos distintos — el input se limpia siempre al
           abrir el modal (ver contextFiles.js) para que cada proyecto muestre
           únicamente su propia ruta guardada, nunca la del proyecto anterior. -->
      <div id="contextProjectFolderSection" class="context-snapshot-section">
        <div class="context-snapshot-header">
          <span class="context-snapshot-title">Carpeta del proyecto</span>
        </div>

        <div class="context-snapshot-controls">
          <input
            id="contextProjectFolderInput"
            type="text"
            class="context-snapshot-input"
            placeholder="Ruta de la carpeta, ej: D:/Documentos/Cliente"
          />
          <button id="contextProjectFolderBrowse" class="context-snapshot-btn" title="Seleccionar carpeta">📁</button>
          <button id="contextProjectFolderBtn" class="context-snapshot-btn">↻ Escanear carpeta</button>
        </div>

        <div class="context-subsource-row">
          <label class="context-toggle">
            <input type="checkbox" id="contextSnapshotToggle">
            Código (patch mode)
          </label>
          <span id="contextSnapshotStatus" class="snapshot-status snapshot-status--empty">Sin snapshot</span>
        </div>

        <div class="context-subsource-row">
          <label class="context-toggle">
            <input type="checkbox" id="contextLinkedFolderToggle">
            Documentos (PDF, Word, imágenes...)
          </label>
          <span id="contextLinkedFolderStatus" class="snapshot-status snapshot-status--empty">Sin escanear</span>
        </div>
      </div>

      <div id="contextFilesList" class="context-files-list">
        <p class="context-empty">No hay archivos de contexto. Sube archivos para que Tempest los use en este proyecto.
        </p>
      </div>

      <div class="modal-actions">
        <button id="closeContextFilesBtn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Configuración del proyecto -->
  <div id="projectConfigModal" class="modal-overlay hidden">
    <div class="modal-box modal-box--wide">
      <h2>Configuración — <span id="projectConfigName"></span></h2>

      <label for="projectPromptTextarea">Prompt personalizado del proyecto</label>
      <textarea id="projectPromptTextarea" rows="10"
        placeholder="Instrucciones específicas para este proyecto...&#10;Ej: Eres un experto en Django. Usa siempre TypeScript. Prefiere patrones REST..."></textarea>

      <label for="projectDefaultModel">Modelo por defecto</label>
      <select id="projectDefaultModel">
        <option value="auto">Automático (recomendado)</option>
        <option value="hermes-q4">Hermes Q4 — rápido</option>
        <option value="hermes-q5">Hermes Q5 — balanceado</option>
        <option value="hermes-q6">Hermes Q6 — calidad</option>
        <option value="deepseek-coder-6.7b-q6">DeepSeek Coder — código diario</option>
        <option value="qwen-coder-14b-q4">Qwen Coder 14B — arquitectura</option>
        <option value="llama-3.1-8b-q5">LLaMA 3.1 8B — general</option>
        <option value="qwen2.5-7b-q5">Qwen2.5 7B — análisis</option>
        <option value="gemma-2-9b-q4">Gemma 2 9B — explicaciones</option>
      </select>

      <label for="projectDefaultMode">Modo por defecto</label>
      <select id="projectDefaultMode">
        <option value="auto">Automático (por mensaje)</option>
        <option value="general">General</option>
        <option value="explain">Explicar</option>
        <option value="coder/hybrid">Coder Hybrid</option>
        <option value="coder/strict">Coder Strict</option>
      </select>

      <div class="modal-actions">
        <button id="cancelProjectConfigBtn">Cancelar</button>
        <button id="saveProjectConfigBtn">Guardar</button>
      </div>
    </div>
  </div>



  <script type="module" src="app.js"></script>
</body>

</html>
